name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, Vet & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod/tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod/go.sum are out of sync. Run 'go mod tidy' and commit."
            exit 1
          }

      - name: Build all packages
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run test suite
        run: go test ./... -timeout 10m

      - name: Run race-detected tests
        run: go test ./... -race -timeout 15m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-results
          path: |
            coverage.out
            coverage.html
          retention-days: 7

  docker-build:
    name: Docker Build
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: adrenochain:ci

      - name: Verify image builds
        run: docker inspect adrenochain:ci >/dev/null

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint changed code
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REV="${{ github.event.pull_request.base.sha }}"
          else
            REV="${{ github.event.before }}"
          fi
          if [ -z "$REV" ] || [ "$REV" = "0000000000000000000000000000000000000000" ]; then
            git fetch origin main
            REV="origin/main"
          fi
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 10m --new-from-rev "$REV" ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Scan for known vulnerabilities
        run: |
          set +e
          "$(go env GOPATH)/bin/govulncheck" ./... | tee /tmp/govulncheck.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          ids=$(grep -oE 'GO-[0-9]+-[0-9]+' /tmp/govulncheck.txt | sort -u)
          echo "Findings: ${ids:-none}"
          # GO-2024-3218 has no upstream fix in go-libp2p-kad-dht.
          if [ "$ids" = "GO-2024-3218" ]; then
            echo "Only the unfixed Kademlia DHT finding remains."
            exit 0
          fi
          exit "$code"
