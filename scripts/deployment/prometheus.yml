global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'adrenochain'
    static_configs:
      - targets: ['172.17.0.1:9093']
    metrics_path: '/prometheus'
    scrape_interval: 5s
    honor_labels: true

  - job_name: 'adrenochain-health'
    static_configs:
      - targets: ['adrenochain:8081']
    metrics_path: '/health'
    scrape_interval: 10s

  - job_name: 'adrenochain-api'
    static_configs:
      - targets: ['adrenochain:8080']
    metrics_path: '/health'
    scrape_interval: 15s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 15s
