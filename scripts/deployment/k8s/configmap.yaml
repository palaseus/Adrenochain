apiVersion: v1
kind: ConfigMap
metadata:
  name: adrenochain-config
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
    app.kubernetes.io/managed-by: adrenochain
data:
  production.yaml: |
    # adrenochain Production Configuration (Kubernetes)
    security:
      enable_tls: true
      enable_auth: true
      api_key_required: true
      rate_limiting: true
      max_connections: 1000
      admin_whitelist:
        - "{{.AdminApiAddress}}"
        - "{{.WebsocketsAdminAddress}}"
    network:
      listen_port: 8545
      p2p_port: 30303
      max_peers: 100
      enable_mdns: false
      enable_relay: false
    blockchain:
      data_dir: "/var/lib/adrenochain/data"
      difficulty: 1000000
      block_time: 15s
    mining:
      enabled: true
      threads: 4
      reward_address: "{{.RewardAddress}}"
    storage:
      engine: "leveldb"
    monitoring:
      enabled: true
      enable_metrics: true
      metrics_port: 9090
    api:
      enabled: true
      listen_addr: "0.0.0.0:8080"
