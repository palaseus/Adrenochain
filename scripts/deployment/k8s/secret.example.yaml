apiVersion: v1
kind: Secret
metadata:
  name: adrenochain-secrets
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
    app.kubernetes.io/managed-by: adrenochain
type: Opaque
# ⚠️  This is an EXAMPLE template only. Do NOT commit real secrets.
# Copy to secret.yaml, base64-encode your values, and manage via a secrets manager
# (e.g. HashiCorp Vault, AWS Secrets Manager, Sealed Secrets, External Secrets).
stringData:
  # Admin API whitelist addresses (replaces hardcoded values in production.yaml)
  admin_api_address: "REPLACE_WITH_ADMIN_API_ADDRESS"
  websockets_admin_address: "REPLACE_WITH_WEBSOCKETS_ADMIN_ADDRESS"
  # Miner reward address
  reward_address: "REPLACE_WITH_REWARD_ADDRESS"
  # TLS / API secrets
  jwt_secret: "REPLACE_WITH_JWT_SECRET"
  api_secret_key: "REPLACE_WITH_API_SECRET_KEY"
