apiVersion: v1
kind: ServiceAccount
metadata:
  name: adrenochain
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
    app.kubernetes.io/managed-by: adrenochain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adrenochain
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
    app.kubernetes.io/managed-by: adrenochain
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adrenochain
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
    app.kubernetes.io/managed-by: adrenochain
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adrenochain
subjects:
  - kind: ServiceAccount
    name: adrenochain
    namespace: adrenochain
