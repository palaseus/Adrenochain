apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adrenochain
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
    app.kubernetes.io/managed-by: adrenochain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adrenochain
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: adrenochain
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adrenochain
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adrenochain
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: adrenochain
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 30303
          protocol: TCP
  egress:
    - to: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
