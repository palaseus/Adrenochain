apiVersion: apps/v1
kind: Deployment
metadata:
  name: adrenochain
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
    app.kubernetes.io/instance: adrenochain
    app.kubernetes.io/managed-by: adrenochain
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adrenochain
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adrenochain
        app.kubernetes.io/instance: adrenochain
    spec:
      serviceAccountName: adrenochain
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: adrenochain
          image: adrenochain:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: api
            - containerPort: 8081
              name: health
            - containerPort: 9090
              name: metrics
            - containerPort: 30303
              name: p2p
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: ADMIN_API_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: adrenochain-secrets
                  key: admin_api_address
                  optional: true
            - name: WEBSOCKETS_ADMIN_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: adrenochain-secrets
                  key: websockets_admin_address
                  optional: true
            - name: REWARD_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: adrenochain-secrets
                  key: reward_address
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: config
          configMap:
            name: adrenochain-config
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: adrenochain
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
    app.kubernetes.io/instance: adrenochain
    app.kubernetes.io/managed-by: adrenochain
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: adrenochain
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: health
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9090
      targetPort: 9090
    - name: p2p
      port: 30303
      targetPort: 30303
---
apiVersion: v1
kind: Service
metadata:
  name: adrenochain-lb
  namespace: adrenochain
  labels:
    app.kubernetes.io/name: adrenochain
    app.kubernetes.io/instance: adrenochain
    app.kubernetes.io/managed-by: adrenochain
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: adrenochain
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: p2p
      port: 30303
      targetPort: 30303
